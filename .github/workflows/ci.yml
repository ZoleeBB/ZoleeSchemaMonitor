name: ZoleeSchemaMonitor | Ellenőrzés és kiadás

on:
  push:
    branches: [MS1, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A kiadási verzióválasztás és publikálás egy futássorban marad.
concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    name: Modell, tárolás, böngésző és grafikai csomag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grafikai függőségek
        run: python3 -m pip install -r tools/requirements-assets.txt
      - name: Csak szükséges méretű képek a Gitben
        run: python3 tools/image_policy.py
      - run: python3 tools/build_assets.py
      - name: A natív katalógus naprakész
        run: |
          python3 tools/generate_catalog.py
          python3 tools/generate_catalog_report.py
          git diff --exit-code -- components/schema_model/schema_catalog.inc doc/grafika/keszlet.md
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fordítható hordozható C-mag
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icomponents/schema_core/include components/schema_core/schema_core.c tests/core_test.c -lm -o /tmp/schema-core-test
          /tmp/schema-core-test
      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3
          path: .native-deps/cjson
      - uses: actions/checkout@v4
        with:
          repository: espressif/mbedtls
          ref: ffb280bb63c78bfec1e1ab55040671768c85c923
          path: .native-deps/mbedtls
      - name: Natív import, titkosítás és megszakadt mentés
        env:
          CJSON_PATH: ${{ github.workspace }}/.native-deps/cjson
          MBEDTLS_PATH: ${{ github.workspace }}/.native-deps/mbedtls
        run: python3 tools/test_native.py
      - uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v9.5.0
          path: .native-deps/lvgl
      - name: Statikus natív rajzoló valódi LVGL-lel
        env:
          CJSON_PATH: ${{ github.workspace }}/.native-deps/cjson
          MBEDTLS_PATH: ${{ github.workspace }}/.native-deps/mbedtls
          LVGL_SOURCE: .native-deps/lvgl
          LVGL_HOST_BUILD: /tmp/schema-lvgl-host
          LVGL_HOST_CFLAGS: -DLV_CONF_SKIP=1 -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB -DLV_USE_LODEPNG=1 -DLV_CACHE_DEF_SIZE=4194304
        run: |
          printf '#define LV_CONF_H\n' > /tmp/schema-lv-conf.h
          cmake -S "$LVGL_SOURCE" -B "$LVGL_HOST_BUILD" -DLV_BUILD_CONF_PATH=/tmp/schema-lv-conf.h -DCONFIG_LV_BUILD_EXAMPLES=OFF -DCONFIG_LV_BUILD_DEMOS=OFF -DCMAKE_BUILD_TYPE=Release -DCONFIG_LV_USE_THORVG_INTERNAL=OFF "-DCMAKE_C_FLAGS=$LVGL_HOST_CFLAGS"
          cmake --build "$LVGL_HOST_BUILD" -j4
          bash tools/test_scene.sh
      - name: Chromium telepítése
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps --only-shell chromium
      - name: Valódi böngészős munkafolyamat
        run: |
          node tests/browser.mjs
          node tests/pipe_flow.mjs
      - name: Valódi fűtési minta exportálása a webszerkesztőből
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/MS1' && contains(github.event.head_commit.message, '[capture-readme]') }}
        run: node tests/readme_preview.mjs
      - name: Kiadási verzió és összevont PR ellenőrzése
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_plan.py
      - name: Teljes grafikai és SD-csomag
        env:
          ASSET_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 tools/build_assets.py --png --output dist/graphics --version "$ASSET_VERSION"
          python3 tools/package_preview.py
      - name: Exportált projektek mindkét kijelzőméretben
        env:
          CJSON_PATH: ${{ github.workspace }}/.native-deps/cjson
          MBEDTLS_PATH: ${{ github.workspace }}/.native-deps/mbedtls
          LVGL_SOURCE: .native-deps/lvgl
          LVGL_HOST_BUILD: /tmp/schema-lvgl-host
          SCHEMA_README_CAPTURE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/MS1' && contains(github.event.head_commit.message, '[capture-readme]') && 'tests/schemas/readme/kijelzo.ppm' || '' }}
        shell: bash
        run: bash tools/test_export_scenes.sh dist/graphics | tee dist/scene-metrics.csv
      - name: Tényleges szerkesztő- és LVGL-képek commitolása az MS1 ágra
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/MS1' && contains(github.event.head_commit.message, '[capture-readme]') }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          directory = Path("tests/schemas/readme")
          source = directory / "kijelzo.ppm"
          assert source.is_file(), "Hiányzik a natív LVGL képpuffer!"
          picture = Image.open(source).convert("RGB")
          assert picture.size == (1280, 800)
          picture.save(directory / "kijelzo.jpg", "JPEG", quality=88, optimize=True)
          source.unlink()

          graphics = json.loads(Path("catalog/image-sizes.json").read_text(encoding="utf-8"))
          for name in ("szerkeszto.jpg", "kijelzo.jpg"):
              file = directory / name
              with Image.open(file) as image:
                  w, h = image.size
              assert w <= 1600 and h <= 1180 and file.stat().st_size <= 512 * 1024, name
              graphics["images"]["tests/schemas/readme/" + name] = {
                  "role": "schema-screenshot", "width": w, "height": h
              }
          Path("catalog/image-sizes.json").write_text(
              json.dumps(graphics, ensure_ascii=False, indent=4) + "\n", encoding="utf-8"
          )

          readme = Path("README.md")
          value = readme.read_text(encoding="utf-8")
          for name in ("szerkeszto.jpg", "kijelzo.jpg"):
              old = "tests/schemas/kazan/" + name
              new = "tests/schemas/readme/" + name
              if old in value:
                  value = value.replace(old, new)
              else:
                  assert new in value, f"Hiányzó README hivatkozás: {new}"
          readme.write_text(value, encoding="utf-8")

          notes = Path("tests/schemas/README.md")
          value = notes.read_text(encoding="utf-8")
          anchor = "## Csőáramlási próba"
          assert anchor in value
          section = """## A README valódi bemutatója

          A [webszerkesztő képe](readme/szerkeszto.jpg) a futó Chromium szerkesztőből,
          a [kijelző képe](readme/kijelzo.jpg) az éles LVGL C-rajzoló RGB565 képpufferéből
          származik. A [projekt exportja](readme/projekt.json) és
          [az oldal exportja](readme/lap-1.json) a tényleges webes Export gombokkal készült.

          A kazán, a keringető, a háromjáratú keverőszelep és a hatkörös osztó főcsatlakozói
          **14 pixeles** piros/kék csövekkel csatlakoznak. A keverő hideg ága egy valós
          T-csomóponton kapcsolódik a visszatérőhöz. Az osztó körönkénti előremenő
          és visszatérő csonkjai **szabadon maradnak**, nincs közöttük fantáziált
          rövidzár vagy U-alakú összekötés.

          Mindkét export szimulált, 65%-os Loxone-értékkel készült; a kijelzőkép
          gazdagépes LVGL-kimenet, nem fizikai ESP32-P4 panelről készült fénykép.
          A megismételhető exportparancs: `node tests/readme_preview.mjs`.
          A CI célzott `[capture-readme]` commitja generálja a natív kijelzőképet.

          """
          if "## A README valódi bemutatója" not in value:
              value = value.replace(anchor, section + anchor, 1)
          notes.write_text(value, encoding="utf-8")
          print("Valódi képek és exportok:", (directory / "szerkeszto.jpg").stat().st_size,
                (directory / "kijelzo.jpg").stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md catalog/image-sizes.json tests/schemas/README.md \
              tests/schemas/readme/projekt.json tests/schemas/readme/lap-1.json \
              tests/schemas/readme/szerkeszto.jpg tests/schemas/readme/kijelzo.jpg
          python3 tools/image_policy.py
          git commit -m "docs: publish real editor and LVGL README captures [skip ci]"
          git push origin HEAD:MS1
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/MS1' && contains(github.event.head_commit.message, '[capture-readme]') && hashFiles('tests/schemas/readme/*.jpg') != '' }}
        with:
          name: schema-readme-real-captures
          path: |
            tests/schemas/readme/*.jpg
            tests/schemas/readme/*.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: schema-scene-metrics
          path: dist/scene-metrics.csv
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: schema-sd-and-web
          path: |
            dist/*.zip
            dist/asset-manifest.json
            dist/assets/*
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.browser-test/*.png') != ''
        with:
          name: schema-browser-preview
          path: .browser-test/*.png
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  firmware:
    name: ESP32-P4 | ESP-IDF 5.5.4
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pontos buildverzió
        env:
          FIRMWARE_VERSION: ${{ needs.checks.outputs.version }}
        run: printf '%s' "$FIRMWARE_VERSION" > version.txt
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: '.'
          # A helyben tiszta konfigurálással ellenőrzött verzió kezeli a
          # feloldásból kieső csomagjelöltek hiányzó Kconfig-feltételeit.
          command: python -m pip install idf-component-manager==2.5.2 && idf.py build
      - uses: actions/download-artifact@v4
        with:
          name: schema-sd-and-web
          path: dist
      - run: python3 tools/package_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: schema-firmware
          path: dist/firmware/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Kiadás main-be összevont PR után
    needs: [checks, firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: schema-*
          merge-multiple: true
      - name: Kiadás publikálása
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ZoleeSchemaMonitor v$VERSION" --generate-notes release/*.zip release/*.bin release/SHA256SUMS.txt release/asset-manifest.json release/update.json release/assets/*
