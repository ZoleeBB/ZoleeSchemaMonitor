name: ZoleeSchemaMonitor | Ellenőrzés és kiadás

on:
  push:
    branches: [MS1, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A kiadási verzióválasztás és publikálás egy futássorban marad.
concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    name: Modell, tárolás, böngésző és grafikai csomag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_assets.py
      - name: A natív katalógus naprakész
        run: |
          python3 tools/generate_catalog.py
          git diff --exit-code -- components/schema_model/schema_catalog.inc
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fordítható hordozható C-mag
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Icomponents/schema_core/include components/schema_core/schema_core.c tests/core_test.c -lm -o /tmp/schema-core-test
          /tmp/schema-core-test
      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: c859b25da02955fef659d658b8f324b5cde87be3
          path: .native-deps/cjson
      - uses: actions/checkout@v4
        with:
          repository: espressif/mbedtls
          ref: ffb280bb63c78bfec1e1ab55040671768c85c923
          path: .native-deps/mbedtls
      - name: Natív import, titkosítás és megszakadt mentés
        env:
          CJSON_PATH: ${{ github.workspace }}/.native-deps/cjson
          MBEDTLS_PATH: ${{ github.workspace }}/.native-deps/mbedtls
        run: python3 tools/test_native.py
      - uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: v9.5.0
          path: .native-deps/lvgl
      - name: Statikus natív rajzoló valódi LVGL-lel
        env:
          CJSON_PATH: ${{ github.workspace }}/.native-deps/cjson
          MBEDTLS_PATH: ${{ github.workspace }}/.native-deps/mbedtls
          LVGL_SOURCE: .native-deps/lvgl
          LVGL_HOST_BUILD: /tmp/schema-lvgl-host
        run: |
          printf '#define LV_CONF_H\n' > /tmp/schema-lv-conf.h
          cmake -S "$LVGL_SOURCE" -B "$LVGL_HOST_BUILD" -DLV_BUILD_CONF_PATH=/tmp/schema-lv-conf.h -DCONFIG_LV_BUILD_EXAMPLES=OFF -DCONFIG_LV_BUILD_DEMOS=OFF '-DCMAKE_C_FLAGS=-DLV_CONF_SKIP=1 -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB'
          cmake --build "$LVGL_HOST_BUILD" -j4
          bash tools/test_scene.sh
      - name: Chromium telepítése
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps --only-shell chromium
      - name: Valódi böngészős munkafolyamat
        run: node tests/browser.mjs
      - name: Kiadási verzió és összevont PR ellenőrzése
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_plan.py
      - name: Teljes grafikai és SD-csomag
        env:
          ASSET_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 -m pip install -r tools/requirements-assets.txt
          python3 tools/build_assets.py --png --output dist/graphics --version "$ASSET_VERSION"
          python3 tools/package_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: schema-sd-and-web
          path: |
            dist/*.zip
            dist/asset-manifest.json
            dist/assets/*
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.browser-test/*.png') != ''
        with:
          name: schema-browser-preview
          path: .browser-test/*.png
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  firmware:
    name: ESP32-P4 | ESP-IDF 5.5.4
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pontos buildverzió
        env:
          FIRMWARE_VERSION: ${{ needs.checks.outputs.version }}
        run: printf '%s' "$FIRMWARE_VERSION" > version.txt
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: '.'
          # A helyben tiszta konfigurálással ellenőrzött verzió kezeli a
          # feloldásból kieső csomagjelöltek hiányzó Kconfig-feltételeit.
          command: python -m pip install idf-component-manager==2.5.2 && idf.py build
      - run: python3 tools/package_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: schema-firmware
          path: dist/firmware/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Kiadás main-be összevont PR után
    needs: [checks, firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: schema-*
          merge-multiple: true
      - name: Kiadás publikálása
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ZoleeSchemaMonitor v$VERSION" --generate-notes release/*.zip release/*.bin release/SHA256SUMS.txt release/asset-manifest.json release/assets/*
