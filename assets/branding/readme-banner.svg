<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
<title id="title">Zolee Schema Monitor – élő gépészeti sémák ESP32-P4 kijelzőn</title>
<desc id="desc">Sötétkék műszaki arculati banner, Zolee Schema Monitor felirattal és stilizált kazán–szivattyú–szelep–osztó-gyűjtő gépészeti sémával.</desc>
<defs>
