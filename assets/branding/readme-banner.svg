  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39b9e4"/><stop offset=".53" stop-color="#8ee8ff"/><stop offset="1" stop-color="#32a8d4"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8ab6cb" stroke-opacity=".068" stroke-width="1"/></pattern>
  <filter id="shadow" x="-30%" y="-40%" width="170%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="13"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".33"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
