  <radialGradient id="halo" cx=".15" cy=".5" r=".8"><stop stop-color="#2ca5c5" stop-opacity=".28"/><stop offset=".55" stop-color="#125071" stop-opacity=".07"/><stop offset="1" stop-color="#0b1727" stop-opacity="0"/></radialGradient>
