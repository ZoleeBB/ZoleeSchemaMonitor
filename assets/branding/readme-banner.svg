  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#304e65"/><stop offset=".55" stop-color="#193247"/><stop offset="1" stop-color="#0f273a"/></linearGradient>
  <linearGradient id="boiler" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dceaf0"/><stop offset=".38" stop-color="#98b1c0"/><stop offset=".78" stop-color="#e5edf0"/><stop offset="1" stop-color="#597589"/></linearGradient>
